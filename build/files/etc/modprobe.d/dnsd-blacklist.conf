# Kernel modules the dnsd appliance has no use for.
#
# Each entry gets both directives on purpose:
#   blacklist X   stops udev/hotplug from autoloading X by alias
#   install X /bin/false   also stops an explicit `modprobe X`
# `blacklist` alone does not prevent a direct modprobe, which is why the pair
# is needed to actually shrink the reachable kernel surface.
#
# This file is authoritative across kernel upgrades, unlike deleting .ko files
# from /lib/modules (which a new kernel package restores).
#
# NOT blacklisted, and must never be: ena, nvme, xen_blkfront, virtio_*,
# ext4, xfs, sch_ingress (this is what provides the clsact qdisc), cls_bpf,
# sch_fq, tcp_bbr.

# ---------------------------------------------------------------------------
# Uncommon network protocols — remote attack surface, never used by a resolver
# ---------------------------------------------------------------------------
blacklist dccp
install dccp /bin/false
blacklist sctp
install sctp /bin/false
blacklist rds
install rds /bin/false
blacklist tipc
install tipc /bin/false
blacklist ax25
install ax25 /bin/false
blacklist netrom
install netrom /bin/false
blacklist x25
install x25 /bin/false
blacklist rose
install rose /bin/false
blacklist decnet
install decnet /bin/false
blacklist econet
install econet /bin/false
blacklist ipx
install ipx /bin/false
blacklist appletalk
install appletalk /bin/false
blacklist psnap
install psnap /bin/false
blacklist p8023
install p8023 /bin/false
blacklist p8022
install p8022 /bin/false
blacklist llc
install llc /bin/false
blacklist n-hdlc
install n-hdlc /bin/false
blacklist atm
install atm /bin/false
blacklist can
install can /bin/false

# ---------------------------------------------------------------------------
# Filesystems that will never be mounted on an EBS-only appliance
# ---------------------------------------------------------------------------
blacklist cramfs
install cramfs /bin/false
blacklist freevxfs
install freevxfs /bin/false
blacklist jffs2
install jffs2 /bin/false
blacklist hfs
install hfs /bin/false
blacklist hfsplus
install hfsplus /bin/false
blacklist udf
install udf /bin/false
blacklist gfs2
install gfs2 /bin/false
blacklist ksmbd
install ksmbd /bin/false
blacklist cifs
install cifs /bin/false
blacklist nfs
install nfs /bin/false
blacklist nfsv3
install nfsv3 /bin/false
blacklist nfsv4
install nfsv4 /bin/false
blacklist nfsd
install nfsd /bin/false

# ---------------------------------------------------------------------------
# Wireless and short-range radio — no such hardware exists on a cloud instance
# ---------------------------------------------------------------------------
blacklist bluetooth
install bluetooth /bin/false
blacklist btusb
install btusb /bin/false
blacklist cfg80211
install cfg80211 /bin/false
blacklist mac80211
install mac80211 /bin/false

# ---------------------------------------------------------------------------
# Physical buses and peripherals with no counterpart in a VM
# ---------------------------------------------------------------------------
blacklist firewire-core
install firewire-core /bin/false
blacklist thunderbolt
install thunderbolt /bin/false
blacklist usb-storage
install usb-storage /bin/false
blacklist uas
install uas /bin/false
blacklist floppy
install floppy /bin/false
blacklist joydev
install joydev /bin/false
blacklist pcspkr
install pcspkr /bin/false
blacklist snd
install snd /bin/false
blacklist soundcore
install soundcore /bin/false
blacklist vivid
install vivid /bin/false
