# dnsd appliance network tuning.
#
# Applied at boot by systemd-sysctl.service. Values here are RAM-independent;
# the memory-proportional ones (udp_mem / tcp_mem) are computed at boot by
# dnsd-tune-memory.service, and NIC ring/queue sizing is not a sysctl at all —
# see /usr/local/sbin/dnsd-tune-nic.
#
# Re-apply after editing:  sysctl --system

# ---------------------------------------------------------------------------
# Socket buffers
#
# dnsd terminates UDP/53 in userspace and fans queries out to upstream
# resolvers, so both directions are bursty. These are ceilings — a socket only
# grows into them when it needs to.
# ---------------------------------------------------------------------------
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# Ancillary/option memory per socket (cmsg, IP_PKTINFO, ...).
net.core.optmem_max = 131072

# ---------------------------------------------------------------------------
# UDP
# ---------------------------------------------------------------------------
# Floor each UDP socket is guaranteed even under global memory pressure.
# A 512-query burst of ~512B answers fits comfortably in 256 KiB.
net.ipv4.udp_rmem_min = 262144
net.ipv4.udp_wmem_min = 262144

# Skip the full route lookup for established UDP flows (upstream forwarding).
net.ipv4.udp_early_demux = 1

# ---------------------------------------------------------------------------
# Ingress backlog and NAPI budget
#
# Packets that XDP passes (XDP_PASS) land on the per-CPU backlog before the
# stack picks them up. A DNS reflector-style burst overruns the 1000-packet
# default long before dnsd ever sees it, so raise it hard.
# ---------------------------------------------------------------------------
net.core.netdev_max_backlog = 65536

# Packets and microseconds a single NAPI poll may consume before yielding.
# Defaults (300 / 2000) cause drops at high pps on multi-queue ENA NICs.
net.core.netdev_budget = 1200
net.core.netdev_budget_usecs = 8000
net.core.dev_weight = 128

# Accept queue depth for the :9090 metrics listener.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192

# Busy polling trades CPU for tail latency. Off by default: on small instance
# types it starves the userspace resolver loop. Enable (50-100 us) only on
# dedicated, oversized appliance nodes.
# net.core.busy_poll = 50
# net.core.busy_read = 50

# ---------------------------------------------------------------------------
# Ephemeral ports
#
# Every forwarded query takes a source port. The default low-water mark of
# 32768 caps concurrency at ~32k in-flight upstream queries.
# ---------------------------------------------------------------------------
net.ipv4.ip_local_port_range = 10240 65000

# ---------------------------------------------------------------------------
# Queueing discipline
#
# fq as the root qdisc coexists with the clsact qdisc dnsd attaches for its TC
# egress program — clsact hangs off the ingress/egress hooks, not off root.
# ---------------------------------------------------------------------------
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Metrics scraping and policy-controller HTTP.
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0

# ---------------------------------------------------------------------------
# Reverse path filtering
#
# Loose mode (2), not strict (1): in -ipam aws-vpc-cni deployments the node
# carries several ENIs and return traffic is legitimately asymmetric. Strict
# mode silently drops it.
# ---------------------------------------------------------------------------
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# The appliance is not a router.
net.ipv4.ip_forward = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1

# IPv6 is not handled by the XDP/TC programs (the BPF maps are keyed on IPv4),
# so leaving it up would create an unfiltered path around dnsd.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1

# ARP table headroom for a large client population on a flat L2 segment.
net.ipv4.neigh.default.gc_thresh1 = 4096
net.ipv4.neigh.default.gc_thresh2 = 8192
net.ipv4.neigh.default.gc_thresh3 = 16384

# ---------------------------------------------------------------------------
# File descriptors, memory, scheduling
# ---------------------------------------------------------------------------
fs.file-max = 2097152
fs.nr_open = 2097152

# eBPF maps and the ring buffer are unswappable anyway; keep the resolver hot.
vm.swappiness = 1
vm.max_map_count = 262144
vm.min_free_kbytes = 131072

kernel.pid_max = 4194304

# ---------------------------------------------------------------------------
# eBPF
# ---------------------------------------------------------------------------
# The JIT is a large win for the per-packet XDP hot path.
net.core.bpf_jit_enable = 1

# Harden the JIT against spraying. 0 = off, 1 = unprivileged, 2 = all.
# dnsd runs as root, so 2 costs nothing operationally.
net.core.bpf_jit_harden = 2

# Only root loads BPF here; deny the unprivileged path entirely.
kernel.unprivileged_bpf_disabled = 1
