# Modules dnsd needs present before it starts.
#
# dnsd creates a clsact qdisc over netlink and hangs a BPF classifier off its
# egress hook. Loading these up front avoids relying on kernel-side module
# autoload from inside a sandboxed service unit, which is the failure mode
# behind "adding clsact qdisc: no such file or directory".

# NOTE: there is no sch_clsact module. The clsact qdisc is registered by
# net/sched/sch_ingress.c, which builds as sch_ingress.ko and carries
# MODULE_ALIAS_NET_SCH("clsact"). Loading "sch_clsact" silently does nothing.
sch_ingress

# dnsd attaches its TC program with DirectAction: true, so cls_bpf is enough —
# act_bpf is not involved.
cls_bpf

# Required by 90-dnsd-network.conf. systemd-sysctl.service is ordered After=
# systemd-modules-load.service, so these are in place before the sysctls that
# reference them are applied — otherwise net.core.default_qdisc=fq and
# net.ipv4.tcp_congestion_control=bbr are silently rejected.
sch_fq
tcp_bbr
