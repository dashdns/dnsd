# Resource limits for interactive/administrative sessions on the appliance.
#
# dnsd itself gets its limits from dnsd.service (LimitMEMLOCK, LimitNOFILE);
# these apply to operators running bpftool, ethtool, dig or a manual dnsd
# invocation during troubleshooting, where a low memlock ceiling makes BPF
# loading fail in a confusing way.

*    soft    nofile     1048576
*    hard    nofile     1048576
*    soft    memlock    unlimited
*    hard    memlock    unlimited
root soft    nofile     1048576
root hard    nofile     1048576
root soft    memlock    unlimited
root hard    memlock    unlimited
