apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: dashdns-cluster
  region: eu-central-1
  version: "1.34"

availabilityZones:
  - eu-central-1a
  - eu-central-1b

managedNodeGroups:
  - name: arm-node-group
    instanceType: t4g.small   # ARM-backed (Graviton2) equivalent of t2.small
    amiFamily: AmazonLinux2023
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    availabilityZones:
      - eu-central-1a
      - eu-central-1b
    volumeSize: 20
    volumeType: gp3
    privateNetworking: true
    iam:
      withAddonPolicies:
        imageBuilder: false
        autoScaler: false
        externalDNS: false
        certManager: false
        ebs: true
        efs: false
        albIngress: false
        cloudWatch: false

vpc:
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator